[package]
name = "rvnative"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RVEduSim's desktop engine: native Icarus Verilog and Verilator runs, Verilog folders"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rvnative-bridge"
path = "src/bin/bridge.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
ureq = "3"
base64 = "0.22"
