# Publishes the simulator to GitHub Pages at <owner>.github.io/<repository>/:
# the page built from src/ (npm run build) and only what it loads.
# Pages must be set to deploy from GitHub Actions (Settings > Pages > Source).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Built and deployed in separate jobs, as in GitHub's own template: deploying
# in the job that uploaded can look for the artifact before it is listed.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the page
        run: npm ci && npm run build

      # riscv_simulator.html, the page's old address, forwards to the index.
      - name: Assemble the site
        run: |
          mkdir _site
          cp dist/index.html dist/app.js dist/app.css _site/
          cp -r riscv_simulator.md riscv_simulator_specs.md examples vendor _site/
          cat > _site/riscv_simulator.html <<'EOF'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>RVEduSim</title>
          <meta http-equiv="refresh" content="0; url=./">
          <script>location.replace('./' + location.search + location.hash);</script>
          <a href="./">RVEduSim</a>
          EOF
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
