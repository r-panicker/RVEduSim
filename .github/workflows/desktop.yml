# Builds the desktop app (electron/) for Linux, Windows and macOS. Every
# installer carries native Icarus Verilog and Verilator for its own platform,
# taken from the Toolchain workflow's release for the current build scripts,
# or built from source on the runner when there is none. (Zig, Verilator's
# fallback C++ compiler, is not bundled: the app downloads it on first use
# where the computer has no compiler.)
#
# Run it from the Actions tab, or push a tag named desktop-v*. The installers
# are attached to the run as artifacts; a desktop-v* tag also gets a draft
# GitHub release holding them.
#
# Signing is optional. Without secrets the macOS app is signed ad hoc (users
# open it once with right-click > Open, or System Settings > Privacy &
# Security > Open Anyway) and the Windows installer is unsigned (SmartScreen
# shows "More info > Run anyway"). With these secrets set, electron-builder
# signs, and on macOS notarizes:
#   macOS:   CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,    target: linux-x64, builder: --linux --x64 }
          - { os: windows-2022,    target: win-x64,   builder: --win --x64 }
          - { os: macos-15,        target: mac-arm64, builder: --mac --arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Icarus and Verilator come prebuilt from the Toolchain workflow's release
      # for these build scripts; without one they are built here.
      - name: Fetch toolchain
        id: toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(node electron/scripts/toolchain-key.js)
          if gh release download "$tag" -p "toolchain-${{ matrix.target }}.tar.gz" -D .toolchain; then
            tar -xzf ".toolchain/toolchain-${{ matrix.target }}.tar.gz" -C electron
            echo "Using $tag:"; cat electron/iverilog/${{ matrix.target }}/VERSION electron/verilator/${{ matrix.target }}/VERSION
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "No $tag release for ${{ matrix.target }}: building the toolchain (run the Toolchain workflow to keep one)"
          fi

      - name: Icarus build tools (Linux)
        if: runner.os == 'Linux' && steps.toolchain.outputs.hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y autoconf gperf flex bison zlib1g-dev libbz2-dev libfl-dev help2man perl python3

      - name: Icarus build tools (macOS)
        if: runner.os == 'macOS' && steps.toolchain.outputs.hit != 'true'
        run: |
          brew install autoconf gperf bison flex help2man
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Icarus build tools (Windows)
        if: runner.os == 'Windows' && steps.toolchain.outputs.hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make autoconf gperf flex bison perl python help2man
            mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib mingw-w64-x86_64-bzip2

      - name: Build Icarus Verilog
        if: runner.os != 'Windows' && steps.toolchain.outputs.hit != 'true'
        run: bash electron/scripts/build-iverilog.sh electron/iverilog/${{ matrix.target }}

      - name: Build Icarus Verilog (Windows)
        if: runner.os == 'Windows' && steps.toolchain.outputs.hit != 'true'
        shell: msys2 {0}
        run: bash electron/scripts/build-iverilog.sh electron/iverilog/${{ matrix.target }}

      - name: Build Verilator
        if: runner.os != 'Windows' && steps.toolchain.outputs.hit != 'true'
        run: bash electron/scripts/build-verilator.sh electron/verilator/${{ matrix.target }}

      - name: Build Verilator (Windows)
        if: runner.os == 'Windows' && steps.toolchain.outputs.hit != 'true'
        shell: msys2 {0}
        run: bash electron/scripts/build-verilator.sh electron/verilator/${{ matrix.target }}

      # The page, built from src/ into dist/, which the tests and the app load.
      - name: Build the page
        run: npm ci && npm run build

      - name: Install
        working-directory: electron
        run: npm ci

      # The same checks as on a developer's machine, against this runner's build.
      - name: Native engine against WASM
        working-directory: riscv_simulator_tests
        run: npm ci && node test_hdl_native.js

      # Verilator against Icarus. The runners have a C++ compiler; on Windows
      # it is MSYS2's, put on the PATH for this step.
      - name: Verilator against Icarus
        working-directory: riscv_simulator_tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export PATH="/c/msys64/mingw64/bin:$PATH"; fi
          node test_verilator.js

      # Again with Zig, which the app downloads on a computer without a C++
      # compiler. Run from PowerShell, as the app is, with no MSYS2 on the PATH.
      - name: Verilator with Zig (Windows)
        if: runner.os == 'Windows'
        working-directory: riscv_simulator_tests
        env:
          RVSIM_FORCE_ZIG: '1'
        run: node test_verilator.js

      - name: Package
        working-directory: electron
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          extra=""
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$CSC_LINK" ]; then extra="-c.mac.identity=- -c.mac.notarize=false"; fi
          # A secret that is not set arrives as an empty variable, which
          # electron-builder would take for a certificate path.
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          for v in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do [ -n "${!v}" ] || unset "$v"; done
          npx electron-builder ${{ matrix.builder }} --publish never $extra

      - uses: actions/upload-artifact@v7
        with:
          name: rvedusim-${{ matrix.target }}
          path: |
            electron/dist/*.AppImage
            electron/dist/*.exe
            electron/dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*
